
name: KESHAN FUN GAME V2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Android Project
        run: |
          cordova create build com.keshan.fungamev2 "KESHAN FUN GAME V2"
          cp -r index.html style.css script.js logo.png manifest.json config.xml build/www/
          cd build
          cordova platform add android@latest
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KESHAN-FUN-GAME-V2-APK
          path: build/platforms/android/app/build/outputs/apk/debug/app-debug.apk
