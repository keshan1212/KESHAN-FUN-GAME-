
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#090909">

    <meta name="description"
          content="KESHAN FUN GAME V2 - Neon Block Puzzle">

    <title>KESHAN FUN GAME V2</title>

    <link rel="icon" href="logo.png">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- HEADER -->

        <header class="header">

            <div class="logo-area">

                <img
                    src="logo.png"
                    alt="KESHAN FUN GAME Logo"
                    class="game-logo"
                >

                <div class="brand">
                    <h1>KESHAN</h1>
                    <p>FUN GAME V2</p>
                </div>

            </div>

            <button id="sound-btn"
                    class="icon-btn"
                    aria-label="Toggle sound">
                🔊
            </button>

        </header>


        <!-- PLAYER INFORMATION -->

        <section class="player-info">

            <div class="info-card">
                <span>🏆 BEST SCORE</span>
                <strong id="best-score">0</strong>
            </div>

            <div class="info-card">
                <span>⭐ LEVEL</span>
                <strong id="level">1</strong>
            </div>

        </section>


        <!-- SCORE -->

        <section class="score-section">

            <p>YOUR SCORE</p>

            <h2 id="score">0</h2>

        </section>


        <!-- GAME BOARD -->

        <main class="game-container">

            <div class="board-header">

                <h2>BLOCK PUZZLE</h2>

                <span>8 × 8</span>

            </div>

            <div
                id="game-board"
                class="game-board"
                role="grid"
                aria-label="Block puzzle board"
            >

            </div>

            <p id="game-message">
                PLACE BLOCKS AND CLEAR LINES!
            </p>

        </main>


        <!-- BLOCK TRAY -->

        <section class="block-section">

            <h3>CHOOSE YOUR BLOCKS</h3>

            <div id="block-tray"
                 class="block-tray">

            </div>

        </section>


        <!-- CONTROLS -->

        <section class="controls">

            <button id="restart-btn">
                ↻ RESTART
            </button>

            <button id="pause-btn">
                Ⅱ PAUSE
            </button>

        </section>


        <!-- GAME OVER SCREEN -->

        <div id="game-over"
             class="overlay hidden">

            <div class="popup">

                <h2>GAME OVER</h2>

                <p>Your Score</p>

                <strong id="final-score">0</strong>

                <button id="play-again-btn">
                    PLAY AGAIN
                </button>

            </div>

        </div>


        <!-- PAUSE SCREEN -->

        <div id="pause-screen"
             class="overlay hidden">

            <div class="popup">

                <h2>GAME PAUSED</h2>

                <button id="resume-btn">
                    CONTINUE
                </button>

            </div>

        </div>


        <!-- REWARD AREA -->

        <section class="reward-section">

            <h3>🎁 DAILY REWARD</h3>

            <button id="reward-btn">
                WATCH AD FOR REWARD
            </button>

            <p id="reward-message">
                Bonus rewards coming soon!
            </p>

        </section>


        <!-- AD AREA -->

        <div id="banner-ad"></div>


        <!-- FOOTER -->

        <footer>

            <p>KESHAN FUN GAME V2</p>

            <span>POWERED BY KESHAN GAMING</span>

        </footer>

    </div>


    <!-- GAME JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
